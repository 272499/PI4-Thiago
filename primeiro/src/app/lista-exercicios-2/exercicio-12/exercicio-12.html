<h2>Cadastro de produto</h2>

<label>Nome:</label>
<input type="text" [(ngModel)]="nome">

<br><br>

<label>Quantidade:</label>
<input type="number" [(ngModel)]="quantidade">

<br><br>

<button (click)="cadastrar()">
  Cadastrar
</button>

<p *ngIf="mensagem">
  {{ mensagem }}
</p>

<hr>

<h2>Produtos cadastrados</h2>

<p *ngIf="produtos.length === 0">
  Nenhum produto cadastrado.
</p>

<ul>
  <li *ngFor="let produto of produtos">
    {{ produto.nome }} - Quantidade: {{ produto.quantidade }}

    <button (click)="excluir(produto.id)">
      Excluir
    </button>
  </li>
</ul>
