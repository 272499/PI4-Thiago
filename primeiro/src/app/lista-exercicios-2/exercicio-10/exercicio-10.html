<h2>Produtos</h2>

<div *ngFor="let produto of produtos">

  <p
    [ngStyle]="{
      'font-weight': produto.promocao ? 'bold' : 'normal'
    }"
  >
    {{ produto.nome }}
  </p>

  <p
    [ngStyle]="{
      'color': produto.promocao ? 'red' : 'black'
    }"
  >
    Preço: {{ produto.preco | currency:'BRL' }}
  </p>

  <p *ngIf="produto.promocao">
    Produto em promoção
  </p>

  <button (click)="alternarPromocao(produto)">
    {{ produto.promocao ? 'Desativar promoção' : 'Ativar promoção' }}
  </button>

  <hr>
</div>
