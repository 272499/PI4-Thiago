<ul>
  <li
    *ngFor="
      let disciplina of disciplinas;
      let par = even;
      let impar = odd;
      let primeiro = first;
      let ultimo = last
    "
    [ngClass]="{
      'posicao-par': par,
      'posicao-impar': impar,
      'primeiro': primeiro,
      'ultimo': ultimo
    }"
  >
    {{ disciplina }}
  </li>
</ul>
